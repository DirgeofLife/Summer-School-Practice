<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 3D — 人物棋子版</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #1a1a2e;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  canvas { display: block; }

  #ui {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    pointer-events: none;
    z-index: 10;
    padding: 20px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  #score-panel {
    background: rgba(20, 20, 40, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 12px 24px;
    text-align: center;
    pointer-events: auto;
  }

  #score-label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #8888aa;
    margin-bottom: 2px;
  }

  #score {
    display: block;
    font-size: 28px;
    font-weight: bold;
    color: #ffffff;
  }

  #new-game-btn {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    pointer-events: auto;
    transition: background 0.2s;
    letter-spacing: 0.5px;
  }

  #new-game-btn:hover { background: rgba(255,255,255,0.2); }

  #message-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(10, 10, 30, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    pointer-events: auto;
  }

  #message-overlay.hidden { display: none; }

  .message-box {
    background: rgba(30, 30, 60, 0.95);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 36px 52px;
    text-align: center;
  }

  #message-text {
    font-size: 38px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 20px;
  }

  #message-close-btn {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 10px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  #message-close-btn:hover { background: rgba(255,255,255,0.25); }

  .hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
    z-index: 10;
    pointer-events: none;
  }

  @media (max-width: 600px) {
    #ui { padding: 12px; gap: 10px; }
    #score-panel { padding: 8px 16px; }
    #score { font-size: 22px; }
    #new-game-btn { padding: 8px 14px; font-size: 12px; }
    .message-box { padding: 24px 32px; }
    #message-text { font-size: 28px; }
  }
</style>
</head>
<body>

<div id="ui">
  <div id="score-panel">
    <span id="score-label">SCORE</span>
    <span id="score">0</span>
  </div>
  <button id="new-game-btn">New Game</button>
</div>

<div id="message-overlay" class="hidden">
  <div class="message-box">
    <p id="message-text"></p>
    <button id="message-close-btn">Continue</button>
  </div>
</div>

<p class="hint">↑ ↓ ← → or WASD to play · Drag to rotate view</p>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────
const GRID_SIZE = 4;
const CELL_SIZE = 1.05;
const BOARD_SIZE = GRID_SIZE * CELL_SIZE;
const BOARD_THICKNESS = 0.18;
const BOARD_Y = 0;

const DIRECTION_MAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', W: 'up', s: 'down', S: 'down', a: 'left', A: 'left', d: 'right', D: 'right',
};

const PIECE_COLORS = {
  2:    0xa8d8ea, 4:    0x7ec8a0, 8:    0xf2b179,
  16:   0xe07b5a, 32:   0xd94f7b, 64:   0xc44dff,
  128:  0xf5d442, 256:  0x5be0a6, 512:  0x3bb8e0,
  1024: 0xff6b6b, 2048: 0xffd700,
};

const HEAD_COLOR = 0xffe0bd;
const BASE_COLOR = 0x5c4033;

function getPieceScale(value) {
  return 0.72 + Math.log2(value) * 0.11;
}

function getShakeIntensity(value) {
  return value >= 128 ? Math.log2(value) * 0.008 : 0;
}

// ─────────────────────────────────────
// SCENE SETUP
// ─────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 8, 30);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 50);
const cameraBasePos = new THREE.Vector3(0, 5.8, 7.8);
const cameraLookTarget = new THREE.Vector3(0, -0.15, 0);
camera.position.copy(cameraBasePos);
camera.lookAt(cameraLookTarget);

// ─────────────────────────────────────
// LIGHTING
// ─────────────────────────────────────
const ambientLight = new THREE.AmbientLight(0x404060, 1.8);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xfff5e8, 4.5);
keyLight.position.set(6, 12, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 1024;
keyLight.shadow.mapSize.height = 1024;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 50;
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -10;
keyLight.shadow.bias = -0.0001;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8899cc, 1.8);
fillLight.position.set(-4, 3, -2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 2.5);
rimLight.position.set(0, 1.5, 8);
scene.add(rimLight);

// ─────────────────────────────────────
// STARFIELD BACKGROUND
// ─────────────────────────────────────
const starsGeo = new THREE.BufferGeometry();
const starCount = 400;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPositions[i * 3] = (Math.random() - 0.5) * 20;
  starPositions[i * 3 + 1] = Math.random() * 12 + 3;
  starPositions[i * 3 + 2] = (Math.random() - 0.5) * 20;
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.03, transparent: true, opacity: 0.7 });
const stars = new THREE.Points(starsGeo, starsMat);
scene.add(stars);

// ─────────────────────────────────────
// FLOOR
// ─────────────────────────────────────
const floorGeo = new THREE.PlaneGeometry(20, 20);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x16213e, roughness: 0.9, metalness: 0.1 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3;
floor.receiveShadow = true;
scene.add(floor);

// ─────────────────────────────────────
// BOARD CREATION
// ─────────────────────────────────────
const boardGroup = new THREE.Group();
scene.add(boardGroup);

// Board base
const boardBaseGeo = new THREE.BoxGeometry(BOARD_SIZE + 0.35, BOARD_THICKNESS, BOARD_SIZE + 0.35);
const boardBaseMat = new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 0.5, metalness: 0.15 });
const boardBase = new THREE.Mesh(boardBaseGeo, boardBaseMat);
boardBase.position.y = BOARD_Y - BOARD_THICKNESS / 2;
boardBase.castShadow = true;
boardBase.receiveShadow = true;
boardGroup.add(boardBase);

// Board top surface
const boardTopGeo = new THREE.BoxGeometry(BOARD_SIZE + 0.15, 0.04, BOARD_SIZE + 0.15);
const boardTopMat = new THREE.MeshStandardMaterial({ color: 0xbbada0, roughness: 0.55, metalness: 0.05 });
const boardTop = new THREE.Mesh(boardTopGeo, boardTopMat);
boardTop.position.y = BOARD_Y;
boardTop.receiveShadow = true;
boardGroup.add(boardTop);

// Cell tiles
const cellTileGeo = new THREE.BoxGeometry(CELL_SIZE - 0.1, 0.025, CELL_SIZE - 0.1);
const cellTileMat = new THREE.MeshStandardMaterial({ color: 0xcdc1b4, roughness: 0.6, metalness: 0.05 });

for (let r = 0; r < GRID_SIZE; r++) {
  for (let c = 0; c < GRID_SIZE; c++) {
    const tile = new THREE.Mesh(cellTileGeo, cellTileMat);
    const pos = gridToWorld(r, c);
    tile.position.set(pos.x, BOARD_Y + 0.022, pos.z);
    tile.receiveShadow = true;
    boardGroup.add(tile);
  }
}

// Board edge trim
const edgeGeo = new THREE.BoxGeometry(BOARD_SIZE + 0.45, 0.06, 0.08);
const edgeMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.3, metalness: 0.4 });
[
  { p: [0, BOARD_Y + 0.01, -BOARD_SIZE / 2 - 0.15], r: [0, 0, 0] },
  { p: [0, BOARD_Y + 0.01, BOARD_SIZE / 2 + 0.15], r: [0, 0, 0] },
  { p: [-BOARD_SIZE / 2 - 0.15, BOARD_Y + 0.01, 0], r: [0, Math.PI / 2, 0] },
  { p: [BOARD_SIZE / 2 + 0.15, BOARD_Y + 0.01, 0], r: [0, Math.PI / 2, 0] },
].forEach(({ p, r }) => {
  const edge = new THREE.Mesh(edgeGeo, edgeMat);
  edge.position.set(...p);
  edge.rotation.set(...r);
  edge.castShadow = true;
  boardGroup.add(edge);
});

function gridToWorld(row, col) {
  return new THREE.Vector3(
    (col - 1.5) * CELL_SIZE,
    BOARD_Y + 0.045,
    (row - 1.5) * CELL_SIZE
  );
}

// ─────────────────────────────────────
// PIECE CREATION
// ─────────────────────────────────────
function createNumberTexture(value) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  // Glow
  const gradient = ctx.createRadialGradient(128, 128, 60, 128, 128, 120);
  gradient.addColorStop(0, 'rgba(255,255,255,0.3)');
  gradient.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 256);

  // Background circle
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.arc(128, 128, 90, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(128, 128, 90, 0, Math.PI * 2);
  ctx.stroke();

  // Number
  ctx.fillStyle = '#ffffff';
  const fontSize = value >= 1024 ? 72 : value >= 128 ? 80 : 96;
  ctx.font = `bold ${fontSize}px "Segoe UI", Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(value), 128, 128);

  return new THREE.CanvasTexture(canvas);
}

function createPieceGroup(value) {
  const group = new THREE.Group();
  const scale = getPieceScale(value);
  const bodyColor = PIECE_COLORS[value] || 0x3c3a32;

  // -- Base platform --
  const baseGeo = new THREE.CylinderGeometry(0.33, 0.36, 0.1, 32);
  const baseMat = new THREE.MeshStandardMaterial({ color: BASE_COLOR, roughness: 0.35, metalness: 0.5 });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = 0.05;
  base.castShadow = true;
  base.receiveShadow = true;
  group.add(base);

  // -- Body (lathe robe shape) --
  const robePoints = [
    new THREE.Vector2(0.30, 0.10),
    new THREE.Vector2(0.24, 0.18),
    new THREE.Vector2(0.16, 0.32),
    new THREE.Vector2(0.20, 0.46),
    new THREE.Vector2(0.25, 0.54),
    new THREE.Vector2(0.20, 0.66),
    new THREE.Vector2(0.12, 0.74),
  ];
  const robeGeo = new THREE.LatheGeometry(robePoints, 32);
  const robeMat = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.45, metalness: 0.2, emissive: bodyColor, emissiveIntensity: 0.15 });
  const robe = new THREE.Mesh(robeGeo, robeMat);
  robe.castShadow = true;
  robe.receiveShadow = true;
  group.add(robe);

  // -- Shoulder pads (higher values only) --
  if (value >= 128) {
    const shoulderGeo = new THREE.TorusGeometry(0.22, 0.04, 8, 16, Math.PI);
    const shoulderMat = new THREE.MeshStandardMaterial({
      color: value >= 1024 ? 0xffd700 : 0xddbb55,
      roughness: 0.25,
      metalness: 0.7,
      emissive: value >= 1024 ? 0x332200 : 0x000000,
      emissiveIntensity: 0.3,
    });
    const leftShoulder = new THREE.Mesh(shoulderGeo, shoulderMat);
    leftShoulder.position.set(-0.21, 0.58, 0);
    leftShoulder.rotation.set(0, 0, Math.PI / 2);
    leftShoulder.castShadow = true;
    group.add(leftShoulder);

    const rightShoulder = new THREE.Mesh(shoulderGeo, shoulderMat);
    rightShoulder.position.set(0.21, 0.58, 0);
    rightShoulder.rotation.set(0, 0, -Math.PI / 2);
    rightShoulder.castShadow = true;
    group.add(rightShoulder);
  }

  // -- Belt (mid values) --
  if (value >= 64) {
    const beltGeo = new THREE.TorusGeometry(0.19, 0.025, 8, 32);
    const beltMat = new THREE.MeshStandardMaterial({ color: 0x3d2b1f, roughness: 0.3, metalness: 0.6 });
    const belt = new THREE.Mesh(beltGeo, beltMat);
    belt.position.y = 0.42;
    belt.castShadow = true;
    group.add(belt);
  }

  // -- Head --
  const headGeo = new THREE.SphereGeometry(0.15, 32, 32);
  const headMat = new THREE.MeshStandardMaterial({ color: HEAD_COLOR, roughness: 0.55, metalness: 0.05 });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 0.84;
  head.castShadow = true;
  group.add(head);

  // -- Eyes --
  const eyeGeo = new THREE.SphereGeometry(0.035, 16, 16);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });
  const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
  leftEye.position.set(-0.05, 0.87, 0.13);
  group.add(leftEye);
  const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
  rightEye.position.set(0.05, 0.87, 0.13);
  group.add(rightEye);

  // -- Mouth (higher values have a determined expression) --
  if (value >= 256) {
    const mouthGeo = new THREE.BoxGeometry(0.05, 0.012, 0.01);
    const mouthMat = new THREE.MeshStandardMaterial({ color: 0x331111, roughness: 0.3 });
    const mouth = new THREE.Mesh(mouthGeo, mouthMat);
    mouth.position.set(0, 0.825, 0.145);
    group.add(mouth);
    // Determined eyebrows
    const browGeo = new THREE.BoxGeometry(0.05, 0.012, 0.01);
    const browMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3 });
    const leftBrow = new THREE.Mesh(browGeo, browMat);
    leftBrow.position.set(-0.05, 0.905, 0.14);
    leftBrow.rotation.z = 0.15;
    group.add(leftBrow);
    const rightBrow = new THREE.Mesh(browGeo, browMat);
    rightBrow.position.set(0.05, 0.905, 0.14);
    rightBrow.rotation.z = -0.15;
    group.add(rightBrow);
  }

  // -- Crown for high-value pieces --
  if (value >= 512) {
    const crownBaseGeo = new THREE.CylinderGeometry(0.13, 0.15, 0.06, 32);
    const crownMat = new THREE.MeshStandardMaterial({
      color: value >= 2048 ? 0xffd700 : 0xddbb55,
      roughness: 0.2,
      metalness: 0.8,
      emissive: value >= 2048 ? 0x332200 : 0x000000,
      emissiveIntensity: value >= 2048 ? 0.5 : 0.2,
    });
    const crownBase = new THREE.Mesh(crownBaseGeo, crownMat);
    crownBase.position.y = 0.97;
    crownBase.castShadow = true;
    group.add(crownBase);

    if (value >= 1024) {
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 2;
        const spikeGeo = new THREE.ConeGeometry(0.025, 0.08, 8);
        const spike = new THREE.Mesh(spikeGeo, crownMat);
        spike.position.set(Math.cos(angle) * 0.12, 1.02, Math.sin(angle) * 0.12);
        spike.castShadow = true;
        group.add(spike);
      }
    }
  }

  // -- Number sprite --
  const spriteTexture = createNumberTexture(value);
  const spriteMat = new THREE.SpriteMaterial({ map: spriteTexture, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.position.set(0, 0.48, 0.28);
  sprite.scale.set(0.55, 0.55, 1);
  group.add(sprite);

  group.scale.setScalar(scale);
  return group;
}

// ─────────────────────────────────────
// PARTICLE SYSTEM
// ─────────────────────────────────────
const particles = [];
const particlePool = [];

function spawnParticles(position, color, count) {
  for (let i = 0; i < count; i++) {
    let p;
    if (particlePool.length > 0) {
      p = particlePool.pop();
      p.visible = true;
    } else {
      const geo = new THREE.SphereGeometry(0.03, 6, 6);
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.3, emissive: color, emissiveIntensity: 0.8, transparent: true });
      p = new THREE.Mesh(geo, mat);
      scene.add(p);
    }
    p.position.copy(position);
    p.userData = {
      velocity: new THREE.Vector3(
        (Math.random() - 0.5) * 3,
        Math.random() * 4 + 1,
        (Math.random() - 0.5) * 3
      ),
      life: 0.6 + Math.random() * 0.4,
      age: 0,
    };
    particles.push(p);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.age += dt;
    if (p.userData.age > p.userData.life) {
      p.visible = false;
      p.position.set(0, -999, 0);
      particlePool.push(p);
      particles.splice(i, 1);
    } else {
      const progress = p.userData.age / p.userData.life;
      p.userData.velocity.y += -6 * dt;
      p.position.x += p.userData.velocity.x * dt;
      p.position.y += p.userData.velocity.y * dt;
      p.position.z += p.userData.velocity.z * dt;
      const s = 1 - progress;
      p.scale.setScalar(s);
      p.material.opacity = s;
    }
  }
}

// ─────────────────────────────────────
// GAME STATE
// ─────────────────────────────────────
const gameState = {
  sessionId: null,
  score: 0,
  gameOver: false,
  won: false,
  moving: false,
  grid: Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0)),
};

// pieceEntries: Map<"row,col", { group, value, targetPos, currentPos, animType, animProgress }>
const pieceEntries = new Map();
let shakeIntensity = 0;

function pieceKey(r, c) { return `${r},${c}`; }

// ─────────────────────────────────────
// ANIMATION HELPERS
// ─────────────────────────────────────
function easeOutBack(t) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
}

// ─────────────────────────────────────
// RENDER BOARD STATE
// ─────────────────────────────────────
function syncBoard(newGrid, oldGrid, direction) {
  const newKeys = new Set();
  const isH = direction === 'left' || direction === 'right';
  const reverse = direction === 'right' || direction === 'down';

  for (let major = 0; major < GRID_SIZE; major++) {
    const oldLine = [];
    const newLine = [];

    // Extract non-zero pieces along this row or column
    for (let minor = 0; minor < GRID_SIZE; minor++) {
      const r = isH ? major : minor;
      const c = isH ? minor : major;
      if (oldGrid && oldGrid[r][c] > 0) oldLine.push({ r, c, val: oldGrid[r][c] });
      if (newGrid[r][c] > 0) newLine.push({ r, c, val: newGrid[r][c] });
    }

    // Sort old pieces: slide-front first (leftmost for 'left', topmost for 'up', etc.)
    oldLine.sort((a, b) => {
      const aIdx = isH ? a.c : a.r;
      const bIdx = isH ? b.c : b.r;
      return reverse ? bIdx - aIdx : aIdx - bIdx;
    });

    // Sequential pairing: old pieces map to new positions in order
    let oi = 0;
    for (const np of newLine) {
      const nKey = pieceKey(np.r, np.c);
      newKeys.add(nKey);
      const worldPos = gridToWorld(np.r, np.c);

      if (oi < oldLine.length) {
        const src = oldLine[oi];
        const srcKey = pieceKey(src.r, src.c);
        const isMerge = oi + 1 < oldLine.length && src.val === oldLine[oi + 1].val;
        const entry = pieceEntries.get(srcKey);

        if (entry) {
          pieceEntries.delete(srcKey);
          entry.targetPos = worldPos.clone();

          if (isMerge) {
            entry.value = np.val;
            rebuildPieceMesh(entry, np.val);
            entry.animType = 'merge';
            entry.animProgress = 0;
            spawnParticles(
              new THREE.Vector3(worldPos.x, worldPos.y + 0.4, worldPos.z),
              PIECE_COLORS[np.val] || 0xedc22e,
              Math.min(np.val / 4, 40)
            );
            shakeIntensity = Math.max(shakeIntensity, getShakeIntensity(np.val));

            // Slide second merge source to same target, then remove
            const src2 = oldLine[oi + 1];
            const src2Key = pieceKey(src2.r, src2.c);
            const entry2 = pieceEntries.get(src2Key);
            if (entry2) {
              entry2.targetPos = worldPos.clone();
              entry2.animType = 'move';
              entry2.animProgress = 0;
              // Keep under temp key so it slides then gets removed
              const tmpKey = `_m_${nKey}_${Date.now()}`;
              pieceEntries.set(tmpKey, entry2);
              setTimeout(() => {
                const e = pieceEntries.get(tmpKey);
                if (e) { scene.remove(e.group); disposePiece(e.group); pieceEntries.delete(tmpKey); }
              }, 200);
            }
          } else if (src.r !== np.r || src.c !== np.c) {
            entry.animType = 'move';
            entry.animProgress = 0;
          }

          pieceEntries.set(nKey, entry);
        } else {
          // Fallback: source entry missing, create new piece
          const newEntry = {
            group: createPieceGroup(np.val),
            value: np.val,
            targetPos: worldPos.clone(),
            currentPos: worldPos.clone(),
            animType: 'appear',
            animProgress: 0,
          };
          newEntry.group.position.copy(newEntry.currentPos);
          scene.add(newEntry.group);
          pieceEntries.set(nKey, newEntry);
        }

        oi += isMerge ? 2 : 1;
      } else {
        // No source in old line — newly spawned tile
        const entry = {
          group: createPieceGroup(np.val),
          value: np.val,
          targetPos: worldPos.clone(),
          currentPos: worldPos.clone().add(new THREE.Vector3(0, -2.5, 0)),
          animType: 'spawn',
          animProgress: 0,
        };
        entry.group.position.copy(entry.currentPos);
        scene.add(entry.group);
        pieceEntries.set(nKey, entry);
      }
    }
  }

  // Remove pieces no longer in grid
  for (const [key, entry] of pieceEntries) {
    if (!newKeys.has(key) && !key.startsWith('_m_')) {
      scene.remove(entry.group);
      disposePiece(entry.group);
      pieceEntries.delete(key);
    }
  }
}

function rebuildPieceMesh(entry, value) {
  scene.remove(entry.group);
  disposePiece(entry.group);
  entry.group = createPieceGroup(value);
  entry.group.position.copy(entry.currentPos);
  scene.add(entry.group);
}

function disposePiece(group) {
  group.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      if (child.material.map) child.material.map.dispose();
      child.material.dispose();
    }
  });
}

// ─────────────────────────────────────
// GAME LOOP
// ─────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.1);

  // Update pieces
  for (const [key, entry] of pieceEntries) {
    const speed = 8;
    entry.currentPos.lerp(entry.targetPos, Math.min(speed * dt, 1));
    entry.group.position.copy(entry.currentPos);

    // Spawn animation
    if (entry.animType === 'spawn') {
      entry.animProgress += dt;
      const t = Math.min(entry.animProgress / 0.45, 1);
      const yOffset = (1 - easeOutBack(t)) * -2.5;
      entry.group.position.y = entry.targetPos.y + yOffset;
      if (t >= 1) {
        entry.animType = 'idle';
        entry.group.position.copy(entry.targetPos);
      }
    }

    // Merge animation
    if (entry.animType === 'merge') {
      entry.animProgress += dt;
      const t = Math.min(entry.animProgress / 0.35, 1);
      const s = 1 + Math.sin(t * Math.PI) * 0.25;
      entry.group.scale.setScalar(getPieceScale(entry.value) * s);
      if (t >= 1) {
        entry.animType = 'idle';
        entry.group.scale.setScalar(getPieceScale(entry.value));
      }
    }

    // Move animation — slight hop
    if (entry.animType === 'move') {
      entry.animProgress += dt;
      const t = Math.min(entry.animProgress / 0.15, 1);
      const hop = Math.sin(t * Math.PI) * 0.25;
      entry.group.position.y = entry.currentPos.y + hop;
      if (t >= 1) {
        entry.animType = 'idle';
      }
    }
  }

  // Update particles
  updateParticles(dt);

  // Update shake
  if (shakeIntensity > 0.001) {
    const shakeOffset = new THREE.Vector3(
      (Math.random() - 0.5) * shakeIntensity * 2,
      (Math.random() - 0.5) * shakeIntensity * 2,
      (Math.random() - 0.5) * shakeIntensity * 2
    );
    camera.position.copy(cameraBasePos).add(shakeOffset);
    shakeIntensity *= Math.pow(0.02, dt);
  } else {
    shakeIntensity = 0;
    camera.position.lerp(cameraBasePos, 4 * dt);
  }

  // Subtle idle bob for pieces
  const time = performance.now() * 0.001;
  for (const [key, entry] of pieceEntries) {
    if (entry.animType === 'idle' || entry.animType === 'appear') {
      const bob = Math.sin(time * 1.5 + key.charCodeAt(0) + (key.charCodeAt(2) || 0)) * 0.015;
      entry.group.position.y = entry.targetPos.y + bob;
    }
  }

  // Star twinkle
  stars.rotation.y += dt * 0.02;

  renderer.render(scene, camera);
}

// ─────────────────────────────────────
// UI HELPERS
// ─────────────────────────────────────
function updateScoreDisplay() {
  document.getElementById('score').textContent = gameState.score;
}

function showMessage(text) {
  document.getElementById('message-text').textContent = text;
  document.getElementById('message-overlay').classList.remove('hidden');
}

function hideMessage() {
  document.getElementById('message-overlay').classList.add('hidden');
}

// ─────────────────────────────────────
// API INTERACTION
// ─────────────────────────────────────
async function apiNewGame() {
  const resp = await fetch('/api/game/new', { method: 'POST' });
  const data = await resp.json();
  gameState.sessionId = data.session_id;
  gameState.score = 0;
  gameState.gameOver = false;
  gameState.won = false;
  gameState.moving = false;
  gameState.grid = data.state.board;
  updateScoreDisplay();
  hideMessage();

  // Clear existing pieces
  for (const [key, entry] of pieceEntries) {
    scene.remove(entry.group);
    disposePiece(entry.group);
  }
  pieceEntries.clear();
  shakeIntensity = 0;

  // Create initial pieces (spawned from below)
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const val = gameState.grid[r][c];
      if (val === 0) continue;
      const key = pieceKey(r, c);
      const worldPos = gridToWorld(r, c);
      const entry = {
        group: createPieceGroup(val),
        value: val,
        targetPos: worldPos.clone(),
        currentPos: worldPos.clone().add(new THREE.Vector3(0, -2.5, 0)),
        animType: 'spawn',
        animProgress: 0,
      };
      entry.group.position.copy(entry.currentPos);
      scene.add(entry.group);
      pieceEntries.set(key, entry);
      shakeIntensity = Math.max(shakeIntensity, getShakeIntensity(val));
    }
  }
}

async function apiMakeMove(direction) {
  if (gameState.moving || gameState.gameOver) return;
  gameState.moving = true;

  const oldGrid = gameState.grid.map(row => [...row]);

  try {
    const resp = await fetch(`/api/game/${gameState.sessionId}/move`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ direction }),
    });
    if (!resp.ok) { gameState.moving = false; return; }
    const data = await resp.json();

    if (data.moved) {
      gameState.grid = data.state.board;
      gameState.score = data.state.score;
      updateScoreDisplay();
      syncBoard(data.state.board, oldGrid, direction);

      if (data.state.won && !gameState.won) {
        gameState.won = true;
        setTimeout(() => showMessage('You Win!'), 400);
      }
      if (data.state.game_over) {
        gameState.gameOver = true;
        setTimeout(() => showMessage('Game Over!'), 400);
      }
    }
  } catch (e) {
    console.error('Move error:', e);
  }
  gameState.moving = false;
}

// ─────────────────────────────────────
// INPUT HANDLING
// ─────────────────────────────────────
document.addEventListener('keydown', e => {
  const d = DIRECTION_MAP[e.key];
  if (!d) return;
  e.preventDefault();
  apiMakeMove(d);
});

// Touch swipe
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  if (e.target.tagName === 'BUTTON') return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
  const dir = Math.abs(dx) > Math.abs(dy)
    ? (dx > 0 ? 'right' : 'left')
    : (dy > 0 ? 'down' : 'up');
  apiMakeMove(dir);
});

// Mouse drag to orbit camera
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
const orbitState = { theta: 0, phi: Math.acos(5.8 / 9.72), radius: 9.72 };

function updateCameraPosition() {
  const { theta, phi, radius } = orbitState;
  const x = radius * Math.sin(phi) * Math.sin(theta);
  const y = radius * Math.cos(phi);
  const z = radius * Math.sin(phi) * Math.cos(theta);
  cameraBasePos.set(x, y, z);
  camera.position.copy(cameraBasePos);
  camera.lookAt(cameraLookTarget);
}

document.addEventListener('mousedown', e => {
  if (e.target.tagName === 'BUTTON') return;
  isDragging = true;
  prevMouse = { x: e.clientX, y: e.clientY };
});

document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  orbitState.theta -= dx * 0.005;
  orbitState.phi = Math.max(0.25, Math.min(1.3, orbitState.phi - dy * 0.005));
  updateCameraPosition();
  prevMouse = { x: e.clientX, y: e.clientY };
});

document.addEventListener('mouseup', () => { isDragging = false; });

// Scroll zoom
document.addEventListener('wheel', e => {
  orbitState.phi = Math.max(0.25, Math.min(1.3, orbitState.phi + e.deltaY * 0.001));
  updateCameraPosition();
}, { passive: true });

// Buttons
document.getElementById('new-game-btn').addEventListener('click', apiNewGame);
document.getElementById('message-close-btn').addEventListener('click', hideMessage);

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─────────────────────────────────────
// INIT
// ─────────────────────────────────────
(async function init() {
  let sid = localStorage.getItem('game2048_3d_session');
  if (sid) {
    try {
      const r = await fetch(`/api/game/${sid}/state`);
      if (r.ok) {
        const d = await r.json();
        gameState.sessionId = sid;
        gameState.score = d.score;
        gameState.won = d.won;
        gameState.gameOver = d.game_over;
        gameState.grid = d.board;
        updateScoreDisplay();
        if (d.game_over) showMessage('Game Over!');

        // Create pieces without spawn animation for restored game
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            const val = gameState.grid[r][c];
            if (val === 0) continue;
            const worldPos = gridToWorld(r, c);
            const entry = {
              group: createPieceGroup(val),
              value: val,
              targetPos: worldPos.clone(),
              currentPos: worldPos.clone(),
              animType: 'idle',
              animProgress: 0,
            };
            entry.group.position.copy(worldPos);
            scene.add(entry.group);
            pieceEntries.set(pieceKey(r, c), entry);
          }
        }
        animate();
        return;
      }
    } catch (e) {}
  }
  await apiNewGame();
  animate();
})();

window.addEventListener('beforeunload', () => {
  if (gameState.sessionId) localStorage.setItem('game2048_3d_session', gameState.sessionId);
});
</script>
