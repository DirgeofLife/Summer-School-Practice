<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Agent 训练面板</title>
  <style>
    body { margin: 0; padding: 32px; background: #121728; color: #e8ecff; font-family: Arial, sans-serif; }
    main { max-width: 960px; margin: auto; }
    .panel { background: #202947; border-radius: 12px; padding: 20px; margin: 20px 0; }
    canvas { width: 100%; height: 280px; background: #151c33; border-radius: 8px; }
    input { margin-left: 8px; }
    #summary { display: flex; gap: 16px; flex-wrap: wrap; }
    #summary span { background: #2f3a61; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>三维 2048 Q-learning 训练面板</h1>
    <p>选择 train_agent.py 生成的 training_metrics.json，查看每回合总奖励与得分。</p>
    <input id="metrics-file" type="file" accept="application/json">
    <div id="summary" class="panel">尚未加载训练指标。</div>
    <section class="panel">
      <h2>总奖励</h2>
      <canvas id="reward-chart" width="900" height="280"></canvas>
    </section>
    <section class="panel">
      <h2>得分</h2>
      <canvas id="score-chart" width="900" height="280"></canvas>
    </section>
  </main>
  <script>
    // Draw a single metric series with explicit axes and extrema labels.
    function drawChart(canvas, values, color) {
      const context = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      context.clearRect(0, 0, width, height);
      if (!values.length) return;
      const minimum = Math.min(...values);
      const maximum = Math.max(...values);
      const range = maximum - minimum || 1;
      context.strokeStyle = "#586385";
      context.beginPath();
      context.moveTo(45, 10);
      context.lineTo(45, height - 30);
      context.lineTo(width - 10, height - 30);
      context.stroke();
      context.strokeStyle = color;
      context.lineWidth = 2;
      context.beginPath();
      values.forEach((value, index) => {
        const x = 45 + index * (width - 55) / Math.max(values.length - 1, 1);
        const y = 10 + (maximum - value) * (height - 40) / range;
        if (index === 0) context.moveTo(x, y);
        else context.lineTo(x, y);
      });
      context.stroke();
      context.fillStyle = "#c9d4ff";
      context.fillText("max: " + maximum.toFixed(2), 50, 22);
      context.fillText("min: " + minimum.toFixed(2), 50, height - 10);
    }

    // Update summary figures and both charts from the training JSON file.
    function renderMetrics(metrics) {
      const latest = metrics.at(-1);
      document.getElementById("summary").innerHTML =
        "<span>回合: " + metrics.length + "</span>" +
        "<span>最终得分: " + latest.score + "</span>" +
        "<span>最大方块: " + latest.largest_tile + "</span>" +
        "<span>探索率 ε: " + latest.epsilon.toFixed(3) + "</span>";
      drawChart(document.getElementById("reward-chart"), metrics.map(item => item.total_reward), "#5eead4");
      drawChart(document.getElementById("score-chart"), metrics.map(item => item.score), "#fbbf24");
    }

    document.getElementById("metrics-file").addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => renderMetrics(JSON.parse(reader.result));
      reader.readAsText(file);
    });
  </script>
</body>
</html>
